<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6e82"/>
      <stop offset=".2" stop-color="#8592a2"/>
      <stop offset=".38" stop-color="#cda99b"/>
      <stop offset=".5" stop-color="#f0c290"/>
      <stop offset=".616" stop-color="#ffdea4"/>
    </linearGradient>
    <radialGradient id="halo" cx="195" cy="506" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8dc" stop-opacity="1"/>
      <stop offset=".1" stop-color="#ffe6ae" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ffc47c" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffc47c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c88e"/>
      <stop offset=".16" stop-color="#d4ab8a"/>
      <stop offset=".55" stop-color="#6f8f95"/>
      <stop offset="1" stop-color="#34545c"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a07e"/>
      <stop offset="1" stop-color="#7d5f4d"/>
    </linearGradient>
    <radialGradient id="wet" cx="215" cy="700" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2aa" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe2aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff3d0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff3d0"/>
      <stop offset="1" stop-color="#fff3d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b110d" stop-opacity="0"/>
      <stop offset="1" stop-color="#1b110d" stop-opacity=".55"/>
    </linearGradient>
    <filter id="b1" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="b3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b8" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>

    <g id="couple" fill="#1e1411">
      <!-- 신랑 -->
      <g transform="translate(219 651) scale(.56)">
        <circle cx="0" cy="9" r="6.4"/>
        <path d="M-10 19 Q0 14 10 19 L12 62 L-12 62 Z"/>
        <path d="M-10 20 L-15 54 L-11.5 55 L-6 26 Z"/>
        <path d="M10 20 L20 50 L24 52 L14 24 Z"/>
        <path d="M-10 62 L-1 62 L-6 104 L-13 104 Z"/>
        <path d="M1 62 L11 62 L15 104 L8 104 Z"/>
      </g>
      <!-- 신부 -->
      <g transform="translate(243 656) scale(.52)">
        <circle cx="0" cy="9" r="6"/>
        <path d="M-1 4 Q-9 8 -8 26 L-4 24 Z"/>
        <path d="M-8 19 Q0 15 8 19 L10 46 L-10 46 Z"/>
        <path d="M-10 44 L10 44 L18 104 L-18 104 Z"/>
        <path d="M-8 20 L-22 44 L-18 47 L-4 26 Z"/>
        <path d="M8 20 L12 46 L8 47 L3 26 Z"/>
      </g>
    </g>
  </defs>

  <!-- 하늘 -->
  <rect width="390" height="844" fill="url(#sky)"/>

  <!-- 빛줄기 -->
  <g filter="url(#b8)" fill="#fff1cf">
    <path d="M195 506 L96 0 L150 0 Z" opacity=".16"/>
    <path d="M195 506 L196 0 L250 0 Z" opacity=".13"/>
    <path d="M195 506 L300 0 L346 0 Z" opacity=".12"/>
    <path d="M195 506 L0 150 L0 220 Z" opacity=".1"/>
  </g>
  <rect width="390" height="844" fill="url(#halo)"/>

  <!-- 구름 -->
  <g filter="url(#b8)">
    <ellipse cx="86" cy="286" rx="118" ry="13" fill="#f0c7a4" opacity=".6"/>
    <ellipse cx="102" cy="278" rx="92" ry="8" fill="#6f7d8e" opacity=".5"/>
    <ellipse cx="318" cy="330" rx="104" ry="12" fill="#f3cca6" opacity=".6"/>
    <ellipse cx="330" cy="322" rx="80" ry="7" fill="#74829a" opacity=".45"/>
    <ellipse cx="180" cy="392" rx="150" ry="11" fill="#f6d0a2" opacity=".55"/>
    <ellipse cx="60" cy="440" rx="120" ry="9" fill="#f7d6a8" opacity=".5"/>
    <ellipse cx="340" cy="452" rx="100" ry="9" fill="#f7d6a8" opacity=".5"/>
  </g>

  <!-- 해 -->
  <circle cx="195" cy="506" r="21" fill="#fffbe6"/>
  <circle cx="195" cy="506" r="34" fill="#fff3c8" opacity=".5" filter="url(#b3)"/>

  <!-- 먼 곶 -->
  <path d="M292 520 C300 512 316 509 330 520 Z" fill="#b6a7ad" opacity=".6" filter="url(#b1)"/>
  <path d="M390 520 L390 498 C372 492 352 494 330 501 C306 508 288 514 258 520 Z" fill="#a0929a" opacity=".8" filter="url(#b1)"/>
  <path d="M0 520 L0 448 C14 443 30 437 46 439 C60 441 68 449 84 453 C100 457 108 468 122 478 C136 489 152 503 172 520 Z" fill="#77717d" opacity=".9" filter="url(#b1)"/>
  <path d="M0 520 L0 470 C10 468 20 470 30 476 C44 486 58 500 72 520 Z" fill="#5f5a68" opacity=".9" filter="url(#b1)"/>

  <!-- 바다 -->
  <rect y="520" width="390" height="180" fill="url(#sea)"/>
  <rect y="520" width="390" height="22" fill="#ffe5b0" opacity=".45" filter="url(#b3)"/>
  <g fill="url(#glint)" filter="url(#b1)">
    <rect x="172" y="525" width="46" height="2" rx="1"/>
    <rect x="160" y="536" width="70" height="2.2" rx="1.1" opacity=".95"/>
    <rect x="146" y="549" width="98" height="2.4" rx="1.2" opacity=".9"/>
    <rect x="130" y="564" width="130" height="2.6" rx="1.3" opacity=".85"/>
    <rect x="112" y="581" width="166" height="2.8" rx="1.4" opacity=".78"/>
    <rect x="94" y="600" width="202" height="3" rx="1.5" opacity=".7"/>
    <rect x="76" y="622" width="238" height="3.2" rx="1.6" opacity=".6"/>
    <rect x="60" y="646" width="270" height="3.4" rx="1.7" opacity=".5"/>
    <rect x="46" y="672" width="298" height="3.6" rx="1.8" opacity=".4"/>
  </g>
  <g stroke="#fff5dc" stroke-linecap="round" fill="none" opacity=".22">
    <path d="M20 560 h34"/><path d="M300 548 h40"/><path d="M40 598 h50"/><path d="M280 606 h60"/>
    <path d="M10 640 h60"/><path d="M320 636 h50"/><path d="M96 676 h70"/><path d="M250 668 h80"/>
  </g>

  <!-- 모래사장 -->
  <path d="M0 690 C88 676 172 700 262 688 C322 680 360 690 390 684 L390 844 L0 844 Z" fill="url(#sand)"/>
  <path d="M0 690 C88 676 172 700 262 688 C322 680 360 690 390 684" fill="none" stroke="#fff6e2" stroke-width="2.4" opacity=".6" filter="url(#b1)"/>
  <rect y="690" width="390" height="154" fill="url(#wet)"/>

  <!-- 두 사람과 물에 비친 모습 -->
  <use href="#couple"/>
  <g opacity=".2" filter="url(#b1)">
    <use href="#couple" transform="translate(0 1416) scale(1 -1)"/>
  </g>

  <rect y="700" width="390" height="144" fill="url(#fade)"/>
</svg>
